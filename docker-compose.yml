services:
  tvcalendar:
    build: .
    container_name: tvcalendar-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
    command: ["tvcalendar", "serve", "--port", "8080", "--rate-limit", "15", "--concurrency", "5"]
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  tv-notifier:
    build: .
    container_name: tvcalendar-notifier
    restart: unless-stopped
    environment:
      - TZ=UTC
    command: >
      tv-notifier
      --interval 30s
      --lead-time 15m
      --min-impact High
      # Uncomment and configure your webhook endpoints:
      # --discord-webhook https://discord.com/api/webhooks/your/webhook
      # --telegram-token YOUR_BOT_TOKEN
      # --telegram-chat YOUR_CHAT_ID
      # --slack-webhook https://hooks.slack.com/services/your/webhook
    profiles:
      - notifier
