[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-calendar-go"
version = "3.0.0"
authors = [
  { name="Nosvemos" },
]
description = "High-performance Python wrapper for tradingview-calendar-go CGO bindings"
readme = "../README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.0"
]
