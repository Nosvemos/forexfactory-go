# .goreleaser.yaml
# Production-ready GoReleaser configuration for forexcalendar-go
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: forexcalendar-go
    main: ./cmd/forexcalendar-go/main.go
    binary: forexcalendar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  - id: fc-notifier
    main: ./cmd/fc-notifier/main.go
    binary: fc-notifier
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
